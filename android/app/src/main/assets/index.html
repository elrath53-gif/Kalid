#toast {

  bottom: calc(82px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.18), rgba(20, 16, 42, 0.65));
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  border: 1px solid rgba(255, 255, 255, 0.34);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.35);

@media (max-width: 640px) {

/* ---------- Distribución amplia en pantallas grandes (Tablet / Escritorio) ---------- */
@media (min-width: 960px) {

  }

  main {

.con-strip {

  align-items: stretch;
  overflow-x: auto;
  gap: 8px;

  overscroll-behavior-x: contain;
}

.cfcol {
  flex: 1 0 46px;

.cfmarks {

  background-image:
    repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.24) 0px,

/* ---------- Perillas Rotativas de Precisión (Compresor 6 perillas + Graves/Agudos + Balance + Volumen DVC) ---------- */
.knob-grid-6 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));

  margin-top: 6px;
}

.knob-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-width: 0;
}

.knob-touch {
  position: relative;
  width: 88px;
  height: 88px;

  user-select: none;
  -webkit-user-select: none;
  cursor: ns-resize;
  display: grid;
  place-items: center;
}

.knob-cell.lg .knob-touch {
  width: 126px;
  height: 126px;
}

.knob-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.knob-track-arc {
  fill: none;
  stroke: rgba(255, 255, 255, 0.10);
  stroke-width: 4.2;
  stroke-linecap: round;
}

.knob-val-arc {
  fill: none;
  stroke: var(--kcol, #00E5FF);
  stroke-width: 4.5;
  stroke-linecap: round;
  filter: drop-shadow(0 0 6px var(--kcol, #00E5FF));
}

.knob-face {
  fill: rgba(26, 27, 40, 0.95);
  stroke: rgba(255, 255, 255, 0.20);
  stroke-width: 1.6;
}

.knob-touch.dragging .knob-face {
  stroke: var(--kcol, var(--acc));
}

.knob-ptr {
  stroke: #F8FAFC;
  stroke-width: 3.4;
  stroke-linecap: round;
}

.knob-lbl {
  font-size: 13px;
  font-weight: 600;
  color: #F8FAFC;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;

}

.knob-readout {
  font-size: 12.5px;
  color: #B9B4D8;
  text-align: center;
  white-space: nowrap;
}

.comp-power-row {

  align-items: center;
  gap: 6px;

}

.master-dials-wrap {

.con-subnav-btn[aria-selected="true"] {

/* ---------- Ventana Emergente Translúcida Tipo Vidrio Ahumado ---------- */
.jf-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 9500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(14px, env(safe-area-inset-top, 0px)) 14px max(14px, env(safe-area-inset-bottom, 0px));
  background:
    radial-gradient(circle at 50% 16%, rgba(0, 240, 255, 0.16), transparent 55%),
    rgba(3, 5, 15, 0.74);
  backdrop-filter: blur(22px) saturate(165%);
  -webkit-backdrop-filter: blur(22px) saturate(165%);
  animation: jfFadeIn 0.26s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes jfFadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.jf-glass-modal {
  position: relative;
  width: 100%;
  max-width: 650px;
  max-height: min(91dvh, 860px);
  display: flex;
  flex-direction: column;
  border-radius: 24px;
  background: linear-gradient(160deg, rgba(16, 23, 48, 0.72) 0%, rgba(7, 10, 24, 0.84) 100%);
  border: 1px solid rgba(190, 232, 255, 0.26);
  box-shadow:
    0 28px 70px rgba(0, 0, 0, 0.72),
    inset 0 1px 0 rgba(255, 255, 255, 0.22);
  overflow: hidden;
  color: #F4F8FF;
}

/* ---------- Parte Superior Primero: Hero Futurista Jack Friedrich Beta ---------- */
.jf-futuristic-hero {
  position: relative;
  padding: 20px 22px 16px;
  text-align: center;
  overflow: hidden;
  background:
    radial-gradient(ellipse 90% 80% at 50% 0%, rgba(0, 240, 255, 0.20), transparent 68%),
    radial-gradient(ellipse 65% 60% at 85% 25%, rgba(124, 92, 255, 0.18), transparent 70%),
    linear-gradient(180deg, rgba(14, 22, 46, 0.56) 0%, rgba(8, 12, 28, 0.24) 100%);
  border-bottom: 1px solid rgba(180, 225, 255, 0.16);
  flex-shrink: 0;
}

.jf-laser-scan {
  position: absolute;
  left: -10%;
  right: -10%;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, rgba(0, 240, 255, 0.85) 50%, transparent 100%);
  box-shadow: 0 0 16px rgba(0, 240, 255, 0.75);
  pointer-events: none;
  animation: jfScanSweep 4.4s ease-in-out infinite;
}

@keyframes jfScanSweep {
  0% {
    top: 6%;
    opacity: 0.15;
  }
  50% {
    top: 90%;
    opacity: 0.85;
  }
  100% {
    top: 6%;
    opacity: 0.15;
  }
}

.jf-holo-stage {
  position: relative;
  width: 84px;
  height: 84px;
  margin: 0 auto 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.jf-orbit-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px dashed rgba(0, 240, 255, 0.55);
  box-shadow: 0 0 22px rgba(0, 240, 255, 0.22);
  animation: jfOrbitCw 11s linear infinite;
}

.jf-orbit-ring.inner {
  inset: 9px;
  border-style: solid;
  border-color: rgba(255, 209, 102, 0.55) transparent rgba(124, 92, 255, 0.65) transparent;
  animation: jfOrbitCcw 7s linear infinite;
}

@keyframes jfOrbitCw {
  to {
    transform: rotate(360deg);
  }
}

@keyframes jfOrbitCcw {
  to {
    transform: rotate(-360deg);
  }
}

.jf-prism-bars {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 36px;
  z-index: 1;
}

.jf-prism-bars i {
  display: block;
  width: 3.5px;
  border-radius: 3px;
  background: linear-gradient(180deg, #FFD166 0%, #00F0FF 55%, #7C5CFF 100%);
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.55);
  animation: jfPrismBar 1.35s ease-in-out infinite alternate;
}

.jf-prism-bars i:nth-child(1) { height: 12px; animation-delay: 0.05s; }
.jf-prism-bars i:nth-child(2) { height: 22px; animation-delay: 0.20s; }
.jf-prism-bars i:nth-child(3) { height: 32px; animation-delay: 0.35s; }
.jf-prism-bars i:nth-child(4) { height: 18px; animation-delay: 0.12s; }
.jf-prism-bars i:nth-child(5) { height: 36px; animation-delay: 0.28s; }
.jf-prism-bars i:nth-child(6) { height: 20px; animation-delay: 0.44s; }
.jf-prism-bars i:nth-child(7) { height: 28px; animation-delay: 0.18s; }

@keyframes jfPrismBar {
  0% {
    transform: scaleY(0.38);
    opacity: 0.72;
  }
  100% {
    transform: scaleY(1.08);
    opacity: 1;
  }
}

.jf-kicker {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: #7CE8FF;
  margin-bottom: 5px;
}

.jf-dev-headline {
  margin: 0;
  font-size: clamp(19px, 3.8vw, 25px);

        const midY = ch * 0.54;
        curveCtx.strokeStyle = "rgba(255, 255, 255, 0.14)";
        curveCtx.lineWidth = 1;
        curveCtx.beginPath();
        curveCtx.moveTo(0, midY);
        curveCtx.lineTo(cw, midY);
        curveCtx.stroke();
        if (S.con.vizOn !== false && audio && !audio.paused && freqData && ctx) {
          const nb = 28;
          const bw = cw / nb;
          const sr = ctx.sampleRate || 48e3;
          curveCtx.fillStyle = "rgba(56, 249, 215, 0.19)";
          for (let i = 0; i < nb; i++) {
            const f0 = 25 * Math.pow(720, i / nb);
            const f1 = 25 * Math.pow(720, (i + 1) / nb);
            const a = Math.floor(f0 / (sr / 2) * freqData.length);
            const b = Math.max(a + 1, Math.ceil(f1 / (sr / 2) * freqData.length));
            let pk = 0;
            for (let k = a; k < b && k < freqData.length; k++) if (freqData[k] > pk) pk = freqData[k];
            const bh = pk / 255 * (ch * 0.84);
            curveCtx.fillRect(i * bw + 1, ch - bh, Math.max(1, bw - 2), bh);
          }
        }
        if (studioResp) {
          let hasStudio = false;
          for (let i = 0; i < VIZ_N; i += 3) {
            if (Math.abs(studioResp[i]) > 0.2) {
              hasStudio = true;
              break;
            }
          }
          if (hasStudio) {
            curveCtx.save();
            curveCtx.beginPath();
            for (let i = 0; i < VIZ_N; i++) {
              const x = i / (VIZ_N - 1) * cw;
              const y = clamp(midY - clamp(studioResp[i], -18, 18) / 18 * (ch * 0.42), 3 * dpr, ch - 3 * dpr);
              if (i === 0) curveCtx.moveTo(x, y);
              else curveCtx.lineTo(x, y);
            }
            curveCtx.strokeStyle = "rgba(0, 229, 255, 0.36)";
            curveCtx.setLineDash([4 * dpr, 3 * dpr]);
            curveCtx.lineWidth = 1.4 * dpr;
            curveCtx.stroke();
            curveCtx.restore();
          }
        }
        const activeOutCurve = S.con.enabled !== false ? resp : studioResp;
        if (activeOutCurve) {
          let maxAbsDb = 0;
          let maxBoostDb = 0;
          for (let i = 0; i < VIZ_N; i++) {
            const av = Math.abs(activeOutCurve[i]);
            if (av > maxAbsDb) maxAbsDb = av;
            if (activeOutCurve[i] > maxBoostDb) maxBoostDb = activeOutCurve[i];
          }
          const grad = curveCtx.createLinearGradient(0, 0, cw, 0);
          if (S.con.enabled === false) {
            grad.addColorStop(0, "rgba(148, 163, 184, 0.65)");
            grad.addColorStop(1, "rgba(148, 163, 184, 0.65)");
          } else if (maxBoostDb > 4.5) {
            grad.addColorStop(0, "#00E65B");
            grad.addColorStop(0.4, "#A8FF24");
            grad.addColorStop(0.76, "#FFB81A");
            grad.addColorStop(1, "#00E65B");
          } else if (maxAbsDb > 0.15) {
            grad.addColorStop(0, "#00E65B");
            grad.addColorStop(0.5, "#38F9D7");
            grad.addColorStop(1, "#2589FF");
          } else {
            grad.addColorStop(0, "rgba(56, 249, 215, 0.72)");
            grad.addColorStop(1, "rgba(37, 137, 255, 0.72)");
          }
          curveCtx.save();
          curveCtx.beginPath();
          for (let i = 0; i < VIZ_N; i++) {
            const x = i / (VIZ_N - 1) * cw;
            const y = clamp(midY - clamp(activeOutCurve[i], -18, 18) / 18 * (ch * 0.42), 3.5 * dpr, ch - 3.5 * dpr);
            if (i === 0) curveCtx.moveTo(x, y);
            else curveCtx.lineTo(x, y);

          try {
            window.AndroidBridge?.requestMusicPermission?.();
          } catch (_e) {
          }
        } else toast(NATIVE ? "No hay canciones en el teléfono" : "Añade música primero");
        return;
      }
      if (cur < 0) loadTrack(0, true);
      else if (audio.paused || !userWantsPlaying) playNow();
      else pauseByUser();
    });
    $("#bNext").addEventListener("click", () => nextTrack(false));
    $("#bPrev").addEventListener("click", prevTrack);
    document.addEventListener(
      "pointerdown",
      () => {
        if (ctx && ctx.state === "suspended") ctx.resume();
      },
      { passive: true }
    );
    main.addEventListener(
      "scroll",
      () => {
        scrollBusyUntil = performance.now() + 140;
      },
      { passive: true }
    );
    let loopRaf = 0;
    let last = performance.now();
    let lastCompUi = 0;
    const readCompDb = (node) => {
      if (!node) return 0;
      const r = node.reduction;
      return Math.abs(typeof r === "number" ? r : r && r.value || 0);
    };
    function loop(now) {
      loopRaf = 0;
      if (!isUiAwake()) return;
      loopRaf = requestAnimationFrame(loop);
      const dt = Math.min(0.1, (now - last) / 1e3);
      last = now;
      placePan(dt);
      drawViz(now);
      if (S.fx.hap.on || shakeAmt) hapticTick(now);
      if (now - lastCompUi > 90) {
        lastCompUi = now;
        if (curTab === "con" && ctx && conCompReducEl && S.con.enabled !== false && S.con.compOn) {
          const rdb = readCompDb(N.conComp);
          conCompReducEl.textContent = "Compresor LR4 activo · Reducción −" + rdb.toFixed(1) + " dB";
          if (S.con.vizOn !== false && audio && !audio.paused && drawConCurveFn) {
            drawConCurveFn();
          }
        } else if (curTab === "con" && S.con.vizOn !== false && audio && !audio.paused && drawConCurveFn) {
          drawConCurveFn();
        } else if (curTab === "fx") {
          if (S.fx.sp.on) drawRadar();
          if (ctx && reduc && S.fx.comp.on) {
            reduc.textContent = "Reducción " + readCompDb(N.comp).toFixed(1) + " dB";
          }
          if (ctx && mbReduc && S.fx.mbcomp.on) {
            mbReduc.textContent = "Graves " + readCompDb(N.mbLowC).toFixed(1) + " · Medios " + readCompDb(N.mbMidC).toFixed(1) + " · Agudos " + readCompDb(N.mbHighC).toFixed(1) + " dB";
          }
          if (ctx && deReduc && S.fx.deess.on) {
            deReduc.textContent = "Atenuación sibilante " + readCompDb(N.deComp).toFixed(1) + " dB";
          }
        }
      }
    }
    function applyUiAwakeTransition() {
      const awake = isUiAwake();
      document.body.classList.toggle("ui-idle", !awake);
      syncAnalyserConnection();
      if (!awake) {
        if (loopRaf) {
          cancelAnimationFrame(loopRaf);
          loopRaf = 0;
        }
      } else {
        vizDirty = true;
        last = performance.now();
        bgLast = last;
        if (curTab === "con" && drawConCurveFn) drawConCurveFn();
        if (updateGlobalStatusUi) updateGlobalStatusUi();
        if (!loopRaf) loopRaf = requestAnimationFrame(loop);
      }
    }
    window.__onNativeUiState = (visible, focused) => {
      const wasAwake = isUiAwake();
      nativeUiVisible = !!visible;
      nativeWindowFocused = !!focused;
      if (wasAwake !== isUiAwake()) {
        lastHiddenTransitionTs = performance.now();
        applyUiAwakeTransition();
        if (!isUiAwake()) persistNow();
      }
    };
    window.__onOpenConsoleFromSystem = (callerPkg) => {
      S.con.subPage = "cfg";
      showTab("con");
      syncAll();
      toast(
        callerPkg ? "Consola abierta para " + callerPkg + " · Activa manualmente el interruptor Global si deseas enlazarlo" : "Consola abierta · Activa manualmente las opciones globales que necesites"
      );
    };
    window.__onOpenExternalTrack = (rawJson) => {
      try {
        const o = typeof rawJson === "string" ? JSON.parse(rawJson) : rawJson;
        if (!o || !o.url) return;
        let idx = PL.findIndex((x) => x.url === o.url || String(x.id) === String(o.id));
        if (idx < 0) {
          PL.unshift({
            id: String(o.id || "ext_" + Date.now()),
            name: String(o.name || "Audio externo"),
            artist: String(o.artist || "Abierto desde Android"),
            fmt: String(o.fmt || "AUDIO"),
            duration: 0,
            dateAdded: Date.now() / 1e3,
            url: String(o.url)
          });
          idx = 0;
          renderList();
        }
        showTab("music");
        loadTrack(idx, true);
        toast("Reproduciendo con Estudio + Consola: " + (o.name || "Audio"));
      } catch (_e) {
      }
    };
    let bgLast = performance.now();
    setInterval(() => {
      const now = performance.now();
      const dt = Math.min(0.4, (now - bgLast) / 1e3);
      bgLast = now;
      if (!audio || audio.paused || rebuildingCtx) return;
      if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {
      });
      if (!isUiAwake()) {
        checkAutoCrossfade(audio);
        if (S.fx.sp.on && S.fx.sp.rot) placePan(dt);
        if (S.fx.hap.on) {
          sampleSpectrum();
          hapticTick(now);
        }
      }
    }, 450);
    document.addEventListener("visibilitychange", () => {
      updPermBanner();
      lastHiddenTransitionTs = performance.now();
      applyUiAwakeTransition();
      if (!isUiAwake()) persistNow();
    });
    window.addEventListener("pagehide", () => persistNow());
    renderList();
    renderPresets();
    syncAll();
    applyAll(true);
    showTab("music");
    updPermBanner();
    if (IS_PRO_EDITION) {
      applyCertifiedDomTranslation(rootEl, currentLang);
      updateHeaderProUi();
      if (!proState.legalAccepted) {
        openStartupLegalModal(false);
      }
      setInterval(() => {
        updateHeaderProUi();
      }, 3e4);
    }
    if (NATIVE && window.AndroidBridge?.rescanMusic) {
      try {
        window.AndroidBridge.rescanMusic();
      } catch (_e) {
      }
    }
    applyUiAwakeTransition();
  }

  // <stdin>
  var __el = document.querySelector(".studio-shell");
  if (__el) bootEstudioEQ(__el);
})();

</script>
</body>
